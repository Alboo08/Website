<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Albo — Official Profile</title>
<meta name="description" content="Albo's Personal Bio & Projects">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

:root {
    --bg-color: #030509;
    --card-bg: rgba(12, 17, 29, 0.65);
    --card-border: rgba(255, 255, 255, 0.08);
    --accent: #0088ff;
    --accent-glow: rgba(0, 136, 255, 0.2);
    --text-main: #f8fafc;
    --text-muted: #94a3b8;
}

*{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Plus Jakarta Sans', sans-serif;
    background-color: var(--bg-color);
    color: var(--text-main);
    min-height: 100vh;
    overflow-x: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 0;
}

/* BACKGROUND ANIMATION */
.bg-container {
    position: fixed;
    inset: 0;
    z-index: -10;
    overflow: hidden;
    pointer-events: none;
}

.bg-glow {
    position: absolute;
    width: 600px;
    height: 600px;
    border-radius: 50%;
    filter: blur(140px);
    opacity: 0.22;
    animation: float 18s infinite alternate ease-in-out;
}

.glow-1 { top: -200px; left: -100px; background: #0066ff; }
.glow-2 { bottom: -200px; right: -100px; background: #7928ca; animation-delay: -5s; }

@keyframes float {
    0% { transform: translate(0, 0) scale(1); }
    100% { transform: translate(80px, 50px) scale(1.15); }
}

.grid-overlay {
    position: fixed;
    inset: 0;
    z-index: -9;
    background-image: 
        linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
    background-size: 50px 50px;
    mask-image: radial-gradient(circle at center, black 40%, transparent 85%);
}

/* MAIN CONTAINER */
main {
    width: min(480px, 92%);
    display: flex;
    flex-direction: column;
    gap: 24px;
}

/* GUNS.LOL DISCORD CARD */
.discord-card {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border-radius: 24px;
    padding: 24px;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.1);
    transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
}

.discord-card:hover {
    border-color: rgba(0, 136, 255, 0.3);
    box-shadow: 0 25px 60px rgba(0, 0, 0, 0.7), 0 0 30px var(--accent-glow);
}

.profile-header {
    display: flex;
    align-items: center;
    gap: 18px;
}

.avatar-wrapper {
    position: relative;
    width: 76px;
    height: 76px;
    flex-shrink: 0;
}

.avatar-img {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid rgba(255, 255, 255, 0.12);
}

.status-badge {
    position: absolute;
    bottom: 3px;
    right: 3px;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: #64748b;
    border: 3px solid #080d1a;
    transition: background 0.3s ease, box-shadow 0.3s ease;
}

.profile-info {
    display: flex;
    flex-direction: column;
    gap: 4px;
}

.display-name {
    font-size: 22px;
    font-weight: 800;
    color: var(--text-main);
    letter-spacing: -0.5px;
}

.username {
    font-size: 14px;
    font-weight: 500;
    color: var(--text-muted);
}

.divider {
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
    margin: 20px 0;
}

/* ACTIVITY / SPOTIFY BOX */
.activity-box {
    display: flex;
    align-items: center;
    gap: 14px;
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid rgba(255, 255, 255, 0.05);
    padding: 14px 16px;
    border-radius: 16px;
}

.activity-media {
    width: 46px;
    height: 46px;
    border-radius: 12px;
    background: rgba(255, 255, 255, 0.05);
    display: grid;
    place-items: center;
    font-size: 20px;
    flex-shrink: 0;
    overflow: hidden;
}

.activity-media img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.activity-details {
    display: flex;
    flex-direction: column;
    gap: 2px;
    overflow: hidden;
}

.activity-title {
    font-size: 14px;
    font-weight: 700;
    color: var(--text-main);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.activity-sub {
    font-size: 12px;
    color: var(--text-muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

/* SPOTIFY LOG STATS */
.spotify-stats {
    margin-top: 15px;
    background: rgba(30, 215, 96, 0.05);
    border: 1px solid rgba(30, 215, 96, 0.15);
    border-radius: 16px;
    padding: 14px 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.stats-header {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    font-weight: 700;
    color: #1ed760;
    text-transform: uppercase;
    letter-spacing: 0.5px;
}

.fav-song-info {
    font-size: 13px;
    color: #f1f5f9;
    font-weight: 600;
}

.artist-info {
    font-size: 12px;
    color: var(--text-muted);
}

/* SECTIONS & BUTTONS */
.section-title {
    font-size: 12px;
    font-weight: 800;
    color: #64748b;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    margin-left: 6px;
    margin-bottom: 10px;
}

.link-group {
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.link-card {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 20px;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-radius: 18px;
    color: var(--text-main);
    text-decoration: none;
    font-weight: 600;
    font-size: 15px;
    transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
}

.link-card:hover {
    transform: translateY(-3px);
    border-color: rgba(255, 255, 255, 0.2);
    background: rgba(255, 255, 255, 0.06);
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
}

.link-left {
    display: flex;
    align-items: center;
    gap: 14px;
}

.link-icon {
    font-size: 20px;
    width: 28px;
    height: 28px;
    display: grid;
    place-items: center;
    color: var(--text-main);
}

.link-arrow {
    color: var(--text-muted);
    font-size: 16px;
    transition: transform 0.25s ease;
}

.link-card:hover .link-arrow {
    transform: translateX(4px);
    color: #fff;
}

footer {
    text-align: center;
    font-size: 12px;
    color: #475569;
    margin-top: 10px;
    font-weight: 500;
}
</style>
</head>
<body>

<div class="bg-container">
    <div class="bg-glow glow-1"></div>
    <div class="bg-glow glow-2"></div>
</div>
<div class="grid-overlay"></div>

<main>
    <div class="discord-card">
        <div class="profile-header">
            <div class="avatar-wrapper">
                <img id="avatar" src="https://i.imgur.com/placeholder.png" alt="Avatar" class="avatar-img">
                <div id="status-dot" class="status-badge"></div>
            </div>
            <div class="profile-info">
                <div id="display-name" class="display-name">Albo</div>
                <div id="username" class="username">@albo</div>
            </div>
        </div>

        <div class="divider"></div>

        <div class="activity-box">
            <div id="activity-media" class="activity-media"><i class="fa-solid fa-moon"></i></div>
            <div class="activity-details">
                <div id="activity-title" class="activity-title">Status lädt...</div>
                <div id="activity-sub" class="activity-sub">Verbindung mit Discord...</div>
            </div>
        </div>

        <div class="spotify-stats">
            <div class="stats-header">
                <i class="fa-brands fa-spotify"></i>
                <span>Lieblingssong (Automatisch Geloggt)</span>
            </div>
            <div id="fav-song" class="fav-song-info">Noch kein Song geloggt</div>
            <div id="fav-artist" class="artist-info">Höre Musik über Spotify auf Discord zum Aufzeichnen!</div>
        </div>
    </div>

    <div>
        <div class="section-title">Social Media</div>
        <div class="link-group">
            <a href="https://www.tiktok.com/@boyerik08" target="_blank" class="link-card">
                <div class="link-left">
                    <span class="link-icon"><i class="fa-brands fa-tiktok"></i></span>
                    <span>TikTok</span>
                </div>
                <span class="link-arrow"><i class="fa-solid fa-arrow-right"></i></span>
            </a>

            <a href="https://steamcommunity.com/profiles/76561199436104688/" target="_blank" class="link-card">
                <div class="link-left">
                    <span class="link-icon"><i class="fa-brands fa-steam"></i></span>
                    <span>Steam Profile</span>
                </div>
                <span class="link-arrow"><i class="fa-solid fa-arrow-right"></i></span>
            </a>
        </div>
    </div>

    <div>
        <div class="section-title">Projekte</div>
        <div class="link-group">
            <a href="https://discord.gg/dj5Kzb6wpg" target="_blank" class="link-card">
                <div class="link-left">
                    <span class="link-icon"><i class="fa-solid fa-city"></i></span>
                    <span>Hansestadt Hamburg</span>
                </div>
                <span class="link-arrow"><i class="fa-solid fa-arrow-right"></i></span>
            </a>
        </div>
    </div>

    <footer>
        © 2026 Albo • Built with Cloudflare Pages
    </footer>
</main>

<script>
const DISCORD_ID = "701464620992299058";

// --- LOCAL STORAGE SPOTIFY LOGGER LOGIK ---
function logSpotifySong(songTitle, artistName) {
    if (!songTitle || !artistName) return;

    let songHistory = JSON.parse(localStorage.getItem("albo_song_history") || "{}");
    let artistHistory = JSON.parse(localStorage.getItem("albo_artist_history") || "{}");

    const songKey = `${songTitle} - ${artistName}`;

    // Song Playcount erhöhen
    songHistory[songKey] = (songHistory[songKey] || 0) + 1;
    localStorage.setItem("albo_song_history", JSON.stringify(songHistory));

    // Artist Playcount erhöhen
    artistHistory[artistName] = (artistHistory[artistName] || 0) + 1;
    localStorage.setItem("albo_artist_history", JSON.stringify(artistHistory));

    updateSpotifyStatsUI();
}

function updateSpotifyStatsUI() {
    let songHistory = JSON.parse(localStorage.getItem("albo_song_history") || "{}");
    let artistHistory = JSON.parse(localStorage.getItem("albo_artist_history") || "{}");

    // Meistgehörten Song finden
    let topSong = "";
    let maxSongPlays = 0;
    for (const [song, count] of Object.entries(songHistory)) {
        if (count > maxSongPlays) {
            maxSongPlays = count;
            topSong = song;
        }
    }

    // Meistgehörten Artist finden
    let topArtist = "";
    let maxArtistPlays = 0;
    for (const [artist, count] of Object.entries(artistHistory)) {
        if (count > maxArtistPlays) {
            maxArtistPlays = count;
            topArtist = artist;
        }
    }

    const favSongEl = document.getElementById("fav-song");
    const favArtistEl = document.getElementById("fav-artist");

    if (topSong) {
        favSongEl.textContent = `🎵 ${topSong} (${maxSongPlays}x gehört)`;
        favArtistEl.textContent = `🎤 Meistgehörter Artist: ${topArtist} (${maxArtistPlays} Lieder gehört)`;
    }
}

// Initial Stats UI laden
updateSpotifyStatsUI();

let lastLoggedSong = "";

// --- LANYARD DISCORD LIVE STATUS ---
async function fetchLanyardData() {
    try {
        const res = await fetch(`https://api.lanyard.rest/v1/users/${DISCORD_ID}`);
        const { data } = await res.json();
        if (!data) return;

        // 1. Avatar Update
        const avatarImg = document.getElementById("avatar");
        if (data.discord_user.avatar) {
            const ext = data.discord_user.avatar.startsWith("a_") ? "gif" : "png";
            avatarImg.src = `https://cdn.discordapp.com/avatars/${DISCORD_ID}/${data.discord_user.avatar}.${ext}?size=256`;
        }

        // 2. Namen Update
        document.getElementById("display-name").textContent = data.discord_user.global_name || data.discord_user.username;
        document.getElementById("username").textContent = `@${data.discord_user.username}`;

        // 3. Status Punkt
        const statusDot = document.getElementById("status-dot");
        const statusColors = {
            online: "#22c55e",
            idle: "#eab308",
            dnd: "#ef4444",
            offline: "#64748b"
        };
        const color = statusColors[data.discord_status] || statusColors.offline;
        statusDot.style.background = color;
        statusDot.style.boxShadow = `0 0 14px ${color}`;

        // 4. Aktivität / Spotify Logic
        const mediaBox = document.getElementById("activity-media");
        const titleEl = document.getElementById("activity-title");
        const subEl = document.getElementById("activity-sub");

        if (data.listening_to_spotify) {
            mediaBox.innerHTML = `<img src="${data.spotify.album_art_url}" alt="Album Art">`;
            titleEl.textContent = data.spotify.song;
            subEl.textContent = `von ${data.spotify.artist}`;

            // Automatic Song Logging Check
            const currentSongKey = `${data.spotify.song}-${data.spotify.artist}`;
            if (lastLoggedSong !== currentSongKey) {
                lastLoggedSong = currentSongKey;
                logSpotifySong(data.spotify.song, data.spotify.artist);
            }

        } else if (data.activities && data.activities.length > 0) {
            const game = data.activities.find(a => a.type === 0);
            if (game) {
                if (game.assets && game.assets.large_image) {
                    const appId = game.application_id;
                    const imgId = game.assets.large_image;
                    const imgUrl = imgId.startsWith("mp:external") 
                        ? imgId.replace(/mp:external\/[^\/]+\/https\//, "https://")
                        : `https://cdn.discordapp.com/app-assets/${appId}/${imgId}.png`;
                    mediaBox.innerHTML = `<img src="${imgUrl}" alt="Game Cover">`;
                } else {
                    mediaBox.innerHTML = '<i class="fa-solid fa-gamepad"></i>';
                }
                titleEl.textContent = game.name;
                subEl.textContent = game.details || game.state || "Spielt gerade";
            } else if (data.custom_status) {
                mediaBox.innerHTML = '<i class="fa-solid fa-comment"></i>';
                titleEl.textContent = data.custom_status.state || "Custom Status";
                subEl.textContent = "Discord Status";
            }
        } else {
            mediaBox.innerHTML = '<i class="fa-solid fa-moon"></i>';
            titleEl.textContent = "Keine Aktivität";
            subEl.textContent = "Aktuell offline oder untätig";
        }

    } catch (err) {
        console.error("Lanyard Fetch Error:", err);
    }
}

fetchLanyardData();
setInterval(fetchLanyardData, 6000);
</script>
</body>
</html>
