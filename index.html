<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Albo — Personal Profile</title>
<meta name="description" content="Personal Bio & Links Page">
<style>
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

:root {
    --bg-color: #05070e;
    --card-bg: rgba(13, 19, 32, 0.55);
    --card-border: rgba(255, 255, 255, 0.08);
    --accent: #0088ff;
    --accent-glow: rgba(0, 136, 255, 0.25);
    --text-main: #f8fafc;
    --text-muted: #94a3b8;
}

*{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    font-family: 'Plus Jakarta Sans', sans-serif;
    background-color: var(--bg-color);
    color: var(--text-main);
    min-height: 100vh;
    overflow-x: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
}

/* =========================
   BACKGROUND ANIMATION
========================= */
.bg-container {
    position: fixed;
    inset: 0;
    z-index: -10;
    overflow: hidden;
    pointer-events: none;
}

.bg-glow {
    position: absolute;
    width: 600px;
    height: 600px;
    border-radius: 50%;
    filter: blur(140px);
    opacity: 0.25;
    animation: float 18s infinite alternate ease-in-out;
}

.glow-1 {
    top: -200px;
    left: -100px;
    background: #0066ff;
}

.glow-2 {
    bottom: -200px;
    right: -100px;
    background: #7928ca;
    animation-delay: -5s;
}

@keyframes float {
    0% { transform: translate(0, 0) scale(1); }
    100% { transform: translate(80px, 50px) scale(1.15); }
}

.grid-overlay {
    position: fixed;
    inset: 0;
    z-index: -9;
    background-image: 
        linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
    background-size: 50px 50px;
    mask-image: radial-gradient(circle at center, black 40%, transparent 85%);
}

.stars {
    position: fixed;
    inset: 0;
    z-index: -8;
}

.star {
    position: absolute;
    width: 2px;
    height: 2px;
    background: #fff;
    border-radius: 50%;
    opacity: 0.3;
    animation: pulse 4s infinite alternate ease-in-out;
}

@keyframes pulse {
    0% { opacity: 0.1; transform: scale(0.8); }
    100% { opacity: 0.8; transform: scale(1.2); }
}

/* =========================
   MAIN CONTAINER
========================= */
main {
    width: min(480px, 92%);
    margin: 60px auto;
    display: flex;
    flex-direction: column;
    gap: 20px;
}

/* =========================
   GUNS.LOL STYLE DISCORD CARD
========================= */
.discord-card {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border-radius: 24px;
    padding: 24px;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.1);
    transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
}

.discord-card:hover {
    border-color: rgba(0, 136, 255, 0.3);
    box-shadow: 0 25px 60px rgba(0, 0, 0, 0.7), 0 0 30px var(--accent-glow);
}

.profile-header {
    display: flex;
    align-items: center;
    gap: 18px;
}

.avatar-wrapper {
    position: relative;
    width: 76px;
    height: 76px;
    flex-shrink: 0;
}

.avatar-img {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid rgba(255, 255, 255, 0.12);
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
}

.status-badge {
    position: absolute;
    bottom: 3px;
    right: 3px;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: #64748b;
    border: 3px solid #080d1a;
    transition: background 0.3s ease, box-shadow 0.3s ease;
}

.profile-info {
    display: flex;
    flex-direction: column;
    gap: 4px;
}

.display-name {
    font-size: 22px;
    font-weight: 800;
    color: var(--text-main);
    letter-spacing: -0.5px;
}

.username {
    font-size: 14px;
    font-weight: 500;
    color: var(--text-muted);
}

.divider {
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
    margin: 20px 0;
}

/* ACTIVITY SECTION */
.activity-box {
    display: flex;
    align-items: center;
    gap: 14px;
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid rgba(255, 255, 255, 0.05);
    padding: 14px 16px;
    border-radius: 16px;
}

.activity-media {
    width: 44px;
    height: 44px;
    border-radius: 10px;
    background: rgba(255, 255, 255, 0.05);
    display: grid;
    place-items: center;
    font-size: 20px;
    flex-shrink: 0;
    overflow: hidden;
}

.activity-media img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.activity-details {
    display: flex;
    flex-direction: column;
    gap: 2px;
    overflow: hidden;
}

.activity-title {
    font-size: 14px;
    font-weight: 700;
    color: var(--text-main);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.activity-sub {
    font-size: 12px;
    color: var(--text-muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

/* =========================
   LINK BUTTONS
========================= */
.links-container {
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.link-btn {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 20px;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-radius: 18px;
    color: var(--text-main);
    text-decoration: none;
    font-weight: 600;
    font-size: 15px;
    transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
}

.link-left {
    display: flex;
    align-items: center;
    gap: 14px;
}

.link-icon {
    font-size: 20px;
    width: 32px;
    height: 32px;
    display: grid;
    place-items: center;
}

.link-btn:hover {
    transform: translateY(-3px);
    border-color: rgba(255, 255, 255, 0.2);
    background: rgba(255, 255, 255, 0.06);
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
}

.link-arrow {
    color: var(--text-muted);
    font-size: 18px;
    transition: transform 0.25s ease, color 0.25s ease;
}

.link-btn:hover .link-arrow {
    transform: translateX(4px);
    color: #fff;
}

/* =========================
   FOOTER
========================= */
footer {
    text-align: center;
    font-size: 12px;
    color: #475569;
    margin-top: 20px;
    font-weight: 500;
}
</style>
</head>
<body>

<div class="bg-container">
    <div class="bg-glow glow-1"></div>
    <div class="bg-glow glow-2"></div>
</div>
<div class="grid-overlay"></div>
<div class="stars" id="stars"></div>

<main>
    <div class="discord-card">
        <div class="profile-header">
            <div class="avatar-wrapper">
                <img id="avatar" src="https://i.imgur.com/placeholder.png" alt="Avatar" class="avatar-img">
                <div id="status-dot" class="status-badge"></div>
            </div>
            <div class="profile-info">
                <div id="display-name" class="display-name">Albo</div>
                <div id="username" class="username">@albo</div>
            </div>
        </div>

        <div class="divider"></div>

        <div class="activity-box">
            <div id="activity-media" class="activity-media">💤</div>
            <div class="activity-details">
                <div id="activity-title" class="activity-title">Status lädt...</div>
                <div id="activity-sub" class="activity-sub">Verbindung zu Discord...</div>
            </div>
        </div>
    </div>

    <div class="links-container">
        <a href="https://discord.com/" target="_blank" class="link-btn">
            <div class="link-left">
                <span class="link-icon">💬</span>
                <span>Discord Server</span>
            </div>
            <span class="link-arrow">→</span>
        </a>

        <a href="https://github.com/" target="_blank" class="link-btn">
            <div class="link-left">
                <span class="link-icon">💻</span>
                <span>GitHub Profile</span>
            </div>
            <span class="link-arrow">→</span>
        </a>

        <a href="https://youtube.com/" target="_blank" class="link-btn">
            <div class="link-left">
                <span class="link-icon">▶</span>
                <span>YouTube Channel</span>
            </div>
            <span class="link-arrow">→</span>
        </a>

        <a href="https://tiktok.com/" target="_blank" class="link-btn">
            <div class="link-left">
                <span class="link-icon">♪</span>
                <span>TikTok</span>
            </div>
            <span class="link-arrow">→</span>
        </a>
    </div>

    <footer>
        © 2026 Albo • Built with Cloudflare Pages
    </footer>
</main>

<script>
// BACKGROUND PARTICLES
const starsContainer = document.getElementById("stars");
for(let i = 0; i < 60; i++){
    const star = document.createElement("span");
    star.className = "star";
    star.style.left = Math.random() * 100 + "%";
    star.style.top = Math.random() * 100 + "%";
    star.style.animationDelay = Math.random() * 4 + "s";
    starsContainer.appendChild(star);
}

// LANYARD LIVE DISCORD INTEGRATION
const DISCORD_ID = "701464620992299058"; // Deine Live Discord User-ID

async function fetchLanyardData() {
    try {
        const res = await fetch(`https://api.lanyard.rest/v1/users/${DISCORD_ID}`);
        const { data } = await res.json();
        if (!data) return;

        // 1. Avatar Update
        const avatarImg = document.getElementById("avatar");
        if (data.discord_user.avatar) {
            const ext = data.discord_user.avatar.startsWith("a_") ? "gif" : "png";
            avatarImg.src = `https://cdn.discordapp.com/avatars/${DISCORD_ID}/${data.discord_user.avatar}.${ext}?size=256`;
        }

        // 2. Names Update
        document.getElementById("display-name").textContent = data.discord_user.global_name || data.discord_user.username;
        document.getElementById("username").textContent = `@${data.discord_user.username}`;

        // 3. Status Dot Update
        const statusDot = document.getElementById("status-dot");
        const statusColors = {
            online: "#22c55e",
            idle: "#eab308",
            dnd: "#ef4444",
            offline: "#64748b"
        };
        const color = statusColors[data.discord_status] || statusColors.offline;
        statusDot.style.background = color;
        statusDot.style.boxShadow = `0 0 14px ${color}`;

        // 4. Activity & Spotify Logic
        const mediaBox = document.getElementById("activity-media");
        const titleEl = document.getElementById("activity-title");
        const subEl = document.getElementById("activity-sub");

        if (data.listening_to_spotify) {
            mediaBox.innerHTML = `<img src="${data.spotify.album_art_url}" alt="Album Art">`;
            titleEl.textContent = data.spotify.song;
            subEl.textContent = `von ${data.spotify.artist}`;
        } else if (data.activities && data.activities.length > 0) {
            const game = data.activities.find(a => a.type === 0);
            if (game) {
                if (game.assets && game.assets.large_image) {
                    const appId = game.application_id;
                    const imgId = game.assets.large_image;
                    const imgUrl = imgId.startsWith("mp:external") 
                        ? imgId.replace(/mp:external\/[^\/]+\/https\//, "https://")
                        : `https://cdn.discordapp.com/app-assets/${appId}/${imgId}.png`;
                    mediaBox.innerHTML = `<img src="${imgUrl}" alt="Game Cover">`;
                } else {
                    mediaBox.textContent = "🎮";
                }
                titleEl.textContent = game.name;
                subEl.textContent = game.details || game.state || "Spielt gerade";
            } else if (data.custom_status) {
                mediaBox.textContent = "💬";
                titleEl.textContent = data.custom_status.state || "Custom Status";
                subEl.textContent = "Discord Status";
            }
        } else {
            mediaBox.textContent = "💤";
            titleEl.textContent = "Keine Aktivität";
            subEl.textContent = "Aktuell offline oder untätig";
        }

    } catch (err) {
        console.error("Lanyard Fetch Error:", err);
    }
}

// Initialer Call & Polling alle 6 Sekunden
fetchLanyardData();
setInterval(fetchLanyardData, 6000);
</script>
</body>
</html>
