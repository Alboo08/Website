<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Albo | Profile</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="background"></div>
    <div class="particles"></div>

    <button class="sound" id="soundButton">🔊</button>

    <main class="container">

        <section class="profile-card">

            <div class="avatar-wrapper">
                <img id="avatar"
                     src="https://cdn.discordapp.com/embed/avatars/0.png"
                     class="avatar">
                <span class="online-dot"></span>
            </div>

            <h1 id="username">Albo</h1>
            <p class="subtitle">Developer • Roleplay • Gaming</p>

            <div class="discord-box" id="discordBox">
                <img src="https://cdn.discordapp.com/embed/avatars/0.png">

                <div class="discord-info">
                    <strong id="discordName">Discord nicht verbunden</strong>
                    <span id="discordStatus">Connect your Discord</span>
                </div>

                <button id="discordButton">
                    Discord verbinden
                </button>
            </div>

            <div class="links">

                <a href="https://discord.com/" target="_blank" class="link">
                    <span class="icon">💬</span>
                    <div>
                        <b>Discord</b>
                        <small>Meine Community</small>
                    </div>
                    <span class="arrow">→</span>
                </a>

                <a href="https://github.com/" target="_blank" class="link">
                    <span class="icon">💻</span>
                    <div>
                        <b>GitHub</b>
                        <small>Meine Projekte</small>
                    </div>
                    <span class="arrow">→</span>
                </a>

                <a href="https://www.tiktok.com/" target="_blank" class="link">
                    <span class="icon">♪</span>
                    <div>
                        <b>TikTok</b>
                        <small>@deinname</small>
                    </div>
                    <span class="arrow">→</span>
                </a>

                <a href="#" class="link">
                    <span class="icon">🌐</span>
                    <div>
                        <b>Meine Website</b>
                        <small>Weitere Informationen</small>
                    </div>
                    <span class="arrow">→</span>
                </a>

            </div>

            <div class="views">
                👁 <span id="views">0</span> Besucher
            </div>

        </section>

        <section class="music-player">

            <div class="music-icon">♫</div>

            <div class="music-info">
                <b>Dein Song</b>
                <span>Dein Künstler</span>

                <div class="progress">
                    <div id="progress"></div>
                </div>
            </div>

            <button id="playButton">▶</button>

        </section>

    </main>

    <audio id="music" src="music.mp3"></audio>

    <script src="script.js"></script>

</body>
</html>
